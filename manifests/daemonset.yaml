apiVersion: v1
kind: ServiceAccount
metadata:
  name: forensics-agent
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: forensics-agent
rules:
- apiGroups: [""]
  resources: ["pods", "events", "namespaces", "configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: forensics-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: forensics-agent
subjects:
- kind: ServiceAccount
  name: forensics-agent
  namespace: default
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: forensics-agent
  namespace: default
  labels:
    app: forensics-agent
spec:
  selector:
    matchLabels:
      app: forensics-agent
  template:
    metadata:
      labels:
        app: forensics-agent
    spec:
      serviceAccountName: forensics-agent
      containers:
      - name: forensics-agent
        image: k8s-forensics-agent:latest
        imagePullPolicy: Never
        env:
        - name: FORENSICS_NAMESPACE
          value: "default"
        - name: FORENSICS_INTERVAL
          value: "30"
        - name: FORENSICS_DB
          value: "/data/forensics.db"
        - name: FORENSICS_KEY
          value: "/data/forensics_key.bin"
        volumeMounts:
        - name: forensics-data
          mountPath: /data
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: forensics-data
        emptyDir: {}
